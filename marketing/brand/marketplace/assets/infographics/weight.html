<!doctype html><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1600px;height:900px;background:#ffffff;color:#1c2321;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;padding:84px 110px;display:flex;flex-direction:column}
h1{font-size:68px;font-weight:700;letter-spacing:-0.02em;line-height:1.08}
h1 span{color:#1b6b4c}
.sub{margin-top:18px;font-size:30px;color:#4d5a55}
.rows{margin-top:64px;display:flex;flex-direction:column;gap:46px}
.row .name{font-size:28px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between}
.row .name em{font-style:normal;color:#4d5a55;font-weight:500}
.bar{height:34px;border-radius:17px;margin-bottom:10px;display:flex;align-items:center;padding-left:22px;font-size:20px;font-weight:600;color:#fff;white-space:nowrap}
.b{background:#b9531f}.a{background:#1b6b4c}
.foot{margin-top:auto;font-size:22px;color:#4d5a55}
</style>
<h1>4.4 MB of images, down to <span>264 KB</span></h1>
<div class="sub">Same three images, before and after converting for the web</div>
<div class="rows">
<div class="row"><div class="name">Hero photo<em>2.4 MB &rarr; 142 KB</em></div>
<div class="bar b" style="width:100%">PNG 2.4 MB</div><div class="bar a" style="width:6%;min-width:200px">WebP 142 KB</div></div>
<div class="row"><div class="name">Traffic chart<em>1.1 MB &rarr; 68 KB</em></div>
<div class="bar b" style="width:46%">PNG 1.1 MB</div><div class="bar a" style="width:3%;min-width:200px">WebP 68 KB</div></div>
<div class="row"><div class="name">Team photo<em>860 KB &rarr; 54 KB</em></div>
<div class="bar b" style="width:36%">JPEG 860 KB</div><div class="bar a" style="width:2.3%;min-width:200px">AVIF 54 KB</div></div>
</div>
<div class="foot">Example sizes for a typical blog post</div>
